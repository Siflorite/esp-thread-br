openapi: 3.0.0
info:
  title: Swagger ESP Thread Border Router REST API
  description: |-
    This describes the ESP Thread Border Router REST API. The API is provided by ot_task_br_web if the cmake flag `CONFIG_OPENTHREAD_BR_START_WEB=y` is set. By default
    the REST API listens on any address on port 80.

    Some useful links:
    - [ESP Thread Rorder Router](https://github.com/espressif/esp-thread-br)
  license:
    name: Apache
    url: https://github.com/espressif/esp-thread-br/blob/main/LICENSE
  version: 1.1.0
servers:
  - url: http://localhost:80
tags:
  - name: discovery
    description: REST API version and entry point discovery.
  - name: node
    description: Thread parameters of this node.
  - name: diagnostics
    description: Thread network diagnostic.
paths:
  /.well-known/thread/esp-br-rest:
    get:
      tags:
        - discovery
      summary: Discover the REST API version and entry points
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnownBrRest"
  /web/features:
    get:
      summary: Read compiled Web UI feature flags
      responses:
        "200":
          description: Uncached feature flags; disabled features should be hidden by the UI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_cli: {type: boolean, description: 'CONFIG_ESP_BR_WEB_CLI is enabled.'}
  /cli/events:
    get:
      summary: Subscribe to BR log and CLI output using Server-Sent Events
      description: |-
        Requires CONFIG_ESP_BR_WEB_CLI. Shared RAM transcript, no authentication or TLS.
        At most two subscribers; each owns an asynchronous request and a 4096-byte-stack
        sender task. POST commands and other requests remain available. No browser polling.
        Events are records (up to 16 fragments), status (initial/ready change), gap
        (unread records overwritten), and reset (boot changed or cursor ahead).
        Every event has id SESSION:SEQ and JSON data with string session, string cursor,
        and boolean ready. records additionally contains records[{seq,source,text}],
        where seq is a decimal string and source is log, input, or cli.
        String IDs preserve 64-bit sequence precision. gap/reset position the cursor
        immediately before the oldest retained record. Reads do not consume the ring.
        No ID starts at the oldest retained record without reporting a gap.
        Comment heartbeats are sent every 10 seconds; retry advice is 3000 ms.
        Each sender checks the ring every 50 ms and yields after each bounded batch.
        Send failures close the stream. Clients should recreate a CLOSED EventSource
        with backoff, including after a 503 response.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: {type: string, pattern: '^[0-9]+:[0-9]+$'}
          description: Last fully received event ID. Takes precedence over after.
        - in: query
          name: after
          schema: {type: string, pattern: '^[0-9]+:[0-9]+$'}
          description: Resume ID for a newly created EventSource (for example after pause).
      responses:
        "200":
          description: Persistent chunked event stream; not a finite JSON response.
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: records
                id: 12345:102
                data: {"session":"12345","cursor":"102","ready":true,"records":[{"seq":"102","source":"cli","text":"leader\r\n"}]}

        "400":
          description: Invalid resume ID or unexpected request body.
        "500":
          description: Insufficient memory or unable to create the asynchronous sender.
        "503":
          description: Two subscribers already active, stream unavailable, or server stopping. Retry after 3 seconds.
  /cli:
    get:
      summary: Read recent BR log and CLI output (legacy debug interface; Web UI uses SSE)
      description: Shared RAM transcript; requires CONFIG_ESP_BR_WEB_CLI. No authentication. Available on the management network. Responses are not cached.
      parameters:
        - in: query
          name: after
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Last received cursor; use zero for recent buffered output.
      responses:
        "200":
          description: Up to 16 output fragments from a configurable byte ring (default 16 KiB). Each stored fragment uses 12 bytes of metadata plus up to 255 text bytes. Reading does not consume records; oldest whole records are overwritten when full.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor: {type: integer}
                  session: {type: integer, description: 'Boot identifier; restart from zero if it changes.'}
                  ready: {type: boolean, description: 'OpenThread CLI initialized.'}
                  reset: {type: boolean}
                  dropped: {type: boolean, description: 'Unread output was overwritten.'}
                  more: {type: boolean}
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: {type: integer}
                        source: {type: string, enum: [log, cli, input]}
                        text: {type: string}
        "400":
          description: Invalid cursor.
        "500":
          description: Insufficient memory.
    post:
      summary: Queue one OpenThread CLI command
      description: >-
        Requires CONFIG_ESP_BR_WEB_CLI and CONFIG_OPENTHREAD_CLI. Accepts an optional ot prefix. Runs with device
        privileges and may change configuration or restart the device. The 202 response
        only acknowledges queuing; read shared CLI output for completion or busy rejection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: At most 255 UTF-8 bytes, with no control characters.
                  example: ot state
      responses:
        "202":
          description: Queued; observe Done or Error on GET /cli/events (or legacy GET /cli).
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
        "400":
          description: Invalid JSON, content type, command, or body length.
        "408":
          description: Incomplete request body.
        "500":
          description: Insufficient memory.
        "503":
          description: CLI disabled, not initialized, or task queue unavailable.
  /diagnostics:
    get:
      tags:
        - diagnostics
      summary: Get Thread network diagnostics
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
  /node:
    get:
      tags:
        - node
      summary: Get current active node parameters
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
    delete:
      tags:
        - node
      summary: Erase all persistent information, essentially factory reset the Border Router.
      responses:
        "200":
          description: Successful operation
        "409":
          description: Thread interface is in wrong state.
  /node/ba-id:
    get:
      tags:
        - node
      summary: Get the border agent ID
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: 16 byte border agent ID as hex string.
                example: "AA897CA8A67F6E6DD6166133AD1562A5"
  /node/rloc:
    get:
      tags:
        - node
      summary: Routing Locator IPv6 address of this Thread node.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: RLOC IPv6 address
                example: "fda4:728e:4b39:bc4a:0:ff:fe00:1000"
  /node/rloc16:
    get:
      tags:
        - node
      summary: Routing Locator Router and Child ID (RLOC16).
      description: Last 16-bit of the Routing Locator IPv6 consisting of the Router ID and a Child ID.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: number
                description: RLOC16 address
                example: 4096
  /node/ext-address:
    get:
      tags:
        - node
      summary: IEEE 802.15.4 Extended Address (EUI-64).
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: 8-byte IEEE 802.15.4 Extended Address of this node as hex string.
                example: "C21F906BE0352A4C"
  /node/state:
    get:
      tags:
        - node
      summary: Get current Thread state.
      description: |-
        State describing the current Thread role of this Thread node.
        - disabled: The Thread stack is disabled.
        - detached: Not currently participating in a Thread network/partition.
        - child: The Thread Child role.
        - router: The Thread Router role.
        - leader: The Thread Leader role.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: Current state
                example: "leader"
    put:
      tags:
        - node
      summary: Set current Thread state.
      description: |-
        Enable and disable the Thread protocol operation. If network interface
        hasn't been started yet, it will get started automatically.
      responses:
        "200":
          description: Successful operation.
      requestBody:
        description: New Thread state
        content:
          application/json:
            schema:
              type: string
              description: Can be "enable" or "disable".
              example: "enable"
  /node/network-name:
    get:
      tags:
        - node
      summary: Thread network name this node is part of.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: Thread network name.
                example: "OpenThread-e445"
  /node/leader-data:
    get:
      tags:
        - node
      summary: Gets the network's leader data.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderData"
  /node/ext-panid:
    get:
      tags:
        - node
      summary: Extended PAN ID.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: 8-byte extended PAN ID as hex string.
                example: "3CAB144450CF407E"
  /node/num-of-router:
    get:
      tags:
        - node
      summary: Get number of router devices
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: number
                description: Number of routers
                example: 1
  /node/dataset/active:
    get:
      tags:
        - node
      summary: Get current active operational dataset
      responses:
        "200":
          description: Returns currently active operational dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveDataset"
            text/plain:
              schema:
                $ref: "#/components/schemas/DatasetTlv"
        "204":
          description: No active operational dataset
    put:
      tags:
        - node
      summary: Creates or updates the active operational dataset
      description: |-
        Creates or updates the the active operational dataset on the current node. Only allowed if the Thread node
        is inactive. If the Thread node is active, a pending dataset should be used to update the current active
        operational dataset.
      requestBody:
        description: |-
          Operational dataset that will be stored as active operational dataset. Supports request body Content-Type
          `text/plain` (dataset in TLV format as hex string) or `application/json` (dataset in JSON format). In both
          cases keys which are not set will be initialized with defaults.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveDataset"
          plain/text:
            schema:
              $ref: "#/components/schemas/DatasetTlv"
      responses:
        "200":
          description: Successfully updated the active operational dataset.
        "201":
          description: Successfully created the active operational dataset.
        "400":
          description: Invalid request body.
        "409":
          description: Writing active operational dataset rejected because Thread network is active.
  /node/dataset/pending:
    get:
      tags:
        - node
      summary: Get current pending operational dataset
      responses:
        "200":
          description: Returns currently pending operational dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingDataset"
            text/plain:
              schema:
                $ref: "#/components/schemas/DatasetTlv"
        "204":
          description: No pending operational dataset
    put:
      tags:
        - node
      summary: Creates or updates the pending operational dataset
      description: |-
        Creates or updates the the pending operational dataset on the current node. Delay needs to be set to let
        the pending dataset apply as active dataset in the near future.
      requestBody:
        description: |-
          Operational dataset that will be stored as pending operational dataset. Supports request body Content-Type
          `text/plain` (dataset in TLV format as hex string) or `application/json` (dataset in JSON format). In both
          cases keys which are not set will be initialized with defaults.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingDataset"
          text/plain:
            schema:
              $ref: "#/components/schemas/DatasetTlv"
      responses:
        "200":
          description: Successfully updated the pending operational dataset.
        "201":
          description: Successfully created the pending operational dataset.
        "400":
          description: Invalid request body.
  /node/ba-epskc/state:
    get:
      tags:
        - node
      summary: Get whether the Border Agent ephemeral key (ePSKc) feature is enabled.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: string
                description: Whether the ephemeral key feature is enabled.
                enum: ["enabled", "disabled"]
                example: "enabled"
    put:
      tags:
        - node
      summary: Enable or disable the Border Agent ephemeral key (ePSKc) feature.
      description: |-
        The feature must be enabled before an ephemeral key can be activated
        with a POST request to `/node/ba-epskc/key`.
      responses:
        "200":
          description: Successful operation.
        "400":
          description: Invalid request body.
      requestBody:
        description: New ephemeral key feature state.
        content:
          application/json:
            schema:
              type: string
              description: Can be "enable" or "disable".
              example: "enable"
  /node/ba-epskc/key:
    get:
      tags:
        - node
      summary: Get the status of the Border Agent ephemeral key (ePSKc) session.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpskcStatus"
    post:
      tags:
        - node
      summary: Generate and activate an ephemeral key (ePSKc).
      description: |-
        Generates a new 9-digit Thread Administration Passcode (TAP) and
        starts listening for an external commissioner candidate to connect
        using it. The ephemeral key feature must first be enabled with a PUT
        request to `/node/ba-epskc/state`.
      requestBody:
        description: Optional activation parameters. An empty body uses the device defaults.
        content:
          application/json:
            schema:
              type: object
              properties:
                lifetime:
                  type: integer
                  description: |-
                    The key lifetime in milliseconds. Defaults to 2 minutes
                    when omitted or zero. Capped at 10 minutes.
                  example: 120000
                port:
                  type: integer
                  description: The UDP port to use. Defaults to an ephemeral port when omitted.
                  example: 49152
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpskcActivateResult"
        "400":
          description: Invalid request body.
        "409":
          description: Ephemeral key feature disabled, or a key is already active.
        "500":
          description: Failed to start the ephemeral key session.
    delete:
      tags:
        - node
      summary: Deactivate the currently active ephemeral key (ePSKc), if any.
      description: |-
        Stops the ephemeral key use and disconnects any commissioner session
        using it. Has no effect if there is no ephemeral key in use.
      responses:
        "200":
          description: Successful operation.
components:
  schemas:
    WellKnownBrRest:
      type: object
      properties:
        api:
          type: object
          properties:
            version:
              type: string
              description: The running REST API's semantic version.
              example: "1.1.0"
            base:
              type: string
              description: The base path entry points are relative to.
              example: "/"
        links:
          type: array
          description: RFC 8288 web links to REST API entry points.
          items:
            type: object
            properties:
              href:
                type: string
                example: "/node"
              rel:
                type: string
                example: "node"
              type:
                type: array
                items:
                  type: string
                example: ["application/json"]
    LeaderData:
      type: object
      properties:
        PartitionId:
          type: number
          format: uint32
          description: Partition ID
          example: 1230046604
        Weighting:
          type: number
          format: uint8
          description: Leader Weight
          example: 64
        DataVersion:
          type: number
          description: Full network data version
          example: 244
        StableDataVersion:
          type: number
          format: uint8
          description: Stable Network Data Version
          example: 186
        LeaderRouterId:
          type: number
          format: uint8
          description: Leader Router ID
          example: 4
    ActiveDataset:
      type: object
      properties:
        ActiveTimestamp:
          $ref: "#/components/schemas/Timestamp"
        NetworkKey:
          type: string
          description: Network key, 16 bytes long, formatted as a hexadecimal string
          example: 08277229F21FB7342D705D3CEFDC042A
          default: random
        NetworkName:
          type: string
          description: Network name, 16 bytes long
          example: OpenThread-e445
          default: OpenThread-<PanId>
        ExtPanId:
          type: string
          description: Extended PAN ID, 8 bytes long, formatted as a hexadecimal string
          example: 996D3BEE320097A3
          default: random
        MeshLocalPrefix:
          type: string
          description: Mesh local IPv6 prefix
          example: fd33:d3b9:89e3:72e4::/64
          default: random
        PanId:
          type: integer
          description: IEEE 802.15.4 PAN ID of the Thread network
          format: uint16
          example: 58437
          default: random
        Channel:
          type: integer
          description: IEEE 802.15.4 channel of the Thread network
          format: uint16
          example: 21
          default: random
        PSKc:
          type: string
          description: The pre-shared commissioner key
          example: FD943ECA225A28979B991EFAC1218A72
          default: random
        SecurityPolicy:
          $ref: "#/components/schemas/SecurityPolicy"
        ChannelMask:
          type: integer
          description: Channel mask
          format: uint32
          example: 134215680
          default: 134215680
    PendingDataset:
      type: object
      properties:
        ActiveDataset:
          oneOf:
            - $ref: "#/components/schemas/ActiveDataset"
            - $ref: "#/components/schemas/DatasetTlv"
        PendingTimestamp:
          $ref: "#/components/schemas/Timestamp"
        Delay:
          type: integer
          description: Delay timer in milliseconds
          format: uint32
          example: 30000
          default: not set
    SecurityPolicy:
      type: object
      properties:
        RotationTime:
          type: integer
          description: Thread key rotation time in hours
          format: uint16
          example: 672
          default: 672
        ObtainNetworkKey:
          type: boolean
          description: Obtaining the Network Key for out-of-band commissioning is enabled
          example: true
          default: true
        NativeCommissioning:
          type: boolean
          description: Native Commissioning using PSKc is allowed
          example: true
          default: true
        Routers:
          type: boolean
          description: Thread 1.0/1.1.x Routers are enabled
          example: true
          default: true
        ExternalCommissioning:
          type: boolean
          description: External Commissioner authentication is allowed
          example: true
          default: true
        CommercialCommissioning:
          type: boolean
          description: Commercial Commissioning is enabled
          example: false
          default: false
        AutonomousEnrollment:
          type: boolean
          description: Autonomous Enrollment is enabled
          example: false
          default: false
        NetworkKeyProvisioning:
          type: boolean
          description: Network Key Provisioning is enabled
          example: false
          default: false
        TobleLink:
          type: boolean
          description: ToBLE link is enabled
          example: false
          default: false
        NonCcmRouters:
          type: boolean
          description: Non-CCM Routers enabled
          example: false
          default: false
    Timestamp:
      type: object
      properties:
        Seconds:
          type: integer
          description: Timestamp seconds
          format: uint64
          example: 10
          default: 1
        Ticks:
          type: integer
          description: Timestamp ticks
          format: uint16
          example: 0
          default: 0
        Authoritative:
          type: boolean
          example: false
          default: false
    DatasetTlv:
      type: string
      description: Operational dataset as hex-encoded TLVs.
      example: 0E080000000000010000000300000F35060004001FFFE0020811111111222222220708FDAD70BFE5AA15DD051000112233445566778899AABBCCDDEEFF030E4F70656E54687265616444656D6F010212340410445F2B5CA6F2A93A55CE570A70EFEECB0C0402A0F7F8
    EpskcStatus:
      type: object
      properties:
        state:
          type: string
          description: The Border Agent ephemeral key session state.
          enum: ["disabled", "stopped", "started", "connected", "accepted"]
          example: "started"
        port:
          type: integer
          description: The UDP port used by the ephemeral key session, if active.
          example: 49152
    EpskcActivateResult:
      type: object
      properties:
        tap:
          type: string
          description: The generated 9-digit Thread Administration Passcode (TAP).
          example: "123456789"
        port:
          type: integer
          description: The UDP port the border agent is listening on for the ePSKc session.
          example: 49152
